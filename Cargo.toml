[package]
name = "Plasmer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = "symbols"
debug = 0
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = 3

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"
discord-rich-presence = "1.1"
